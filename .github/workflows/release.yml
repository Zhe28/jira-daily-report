name: release

on:
  push:
    branches: [master]
  workflow_dispatch:   # 手动触发入口

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build exe (cross-compile to Windows)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/daemon/Cargo.toml | head -1)
          if [ -z "$VER" ]; then echo "version not found" >&2; exit 1; fi
          VERSION="v$VER"
          ZIP_NAME="daily-report-${VERSION}-windows-x64.zip"
          # export for the subsequent Publish step
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/daily-report.exe dist/
          cp config.example.toml dist/
          cp README.md dist/
          (cd dist && zip -r "$ZIP_NAME" .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          files: dist/${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true   # 自动生成 What's Changed
          append_body: true              # 追加自定义 body 到自动生成内容之后
          body: |
            ## 📦 下载

            下载下方附件 `daily-report-${{ env.VERSION }}-windows-x64.zip`，解压后运行 `daily-report.exe`。
